name: Deploy Caddy

on:
  push:
    branches: [main]
    paths:
      - 'Caddyfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$(echo "${{ secrets.SSH_ADDRESS }}" | cut -d@ -f2)" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy Caddyfile
        run: |
          scp -i ~/.ssh/id_ed25519 Caddyfile \
            ${{ secrets.SSH_ADDRESS }}:/tmp/Caddyfile

      - name: Install, validate, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_ADDRESS }} '
            set -e
            sudo mv /tmp/Caddyfile /etc/caddy/Caddyfile
            sudo chown root:root /etc/caddy/Caddyfile
            sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            sudo systemctl restart caddy
          '
